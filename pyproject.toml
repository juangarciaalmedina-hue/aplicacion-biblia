[build-system]
requires = ["briefcase"]
build-backend = "briefcase.build"

[project]
name = "biblia-ia"
version = "1.0.2"
description = "Aplicacion biblica con bienvenida y contenido IA"
authors = [{ name = "Juan" }]
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = ["flet", "certifi", "six"]

[tool.flet]
product = "Biblia IA"
artifact = "biblia-ia"
org = "com.jmgalmedina"
company = "JM Galmedina"
build_number = 28

[tool.flet.app]
path = "src"
module = "main"
name = "biblia-ia"
description = "Aplicacion biblica con lectura guiada y ayuda de IA"
exclude = [
    ".git",
    ".github",
    ".env",
    ".env.*",
    "build",
    "dist",
    ".venv",
    "Lib",
    "Scripts",
    "__pycache__",
    ".pytest_cache",
    ".mypy_cache",
    ".ruff_cache",
    ".gradle",
    ".gradle-local",
    ".gradle-user-home",
    ".tmp",
    ".dart_tool",
    "netlify",
    "tests",
    "*.jks",
    "*.bat",
    "*.md",
    "*.txt",
    "*.log",
    "roots.sst",
]

[tool.flet.android]
split_per_abi = true
target_arch = ["arm64"]
bundle_id = "com.jmgalmedina"
artifact = "biblia-ia"
adaptive_icon_background = "#F7F1E3"

[tool.flet.android.signing]
key_store = "C:/APLICACIONBIBLIA/android-upload-key.jks"
key_alias = "upload"

[tool.flet.android.cleanup]
app = true
packages = false
app_files = [
    "README.md",
    "pyproject.toml",
    "requirements.txt",
    ".env.example",
    ".gitignore",
    "netlify.toml",
    "assets",
]

[tool.flet.android.flutter]
build_args = [
    "--tree-shake-icons",
    "--split-debug-info=../android-debug-symbols",
]

[tool.flet.web]
route_url_strategy = "hash"
base_url = "/"
renderer = "auto"
wasm = true
pwa_background_color = "#F7F1E3"
pwa_theme_color = "#C8102E"

[tool.briefcase]
project_name = "Biblia IA"
bundle = "com.jmgalmedina"
version = "1.0.2"
url = "https://tiktok.com/@jmgalmedina"
author = "Juan"
author_email = "example@example.com"

[tool.briefcase.app.biblia_app]
formal_name = "Biblia IA"
description = "Aplicacion biblica con bienvenida y contenido IA"
sources = ["src/biblia_app"]
requires = ["flet", "certifi", "six"]
module = "biblia_app"
